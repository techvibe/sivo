      services: [protocol-service, mcp-adapter]
    policy_envelope:
      allowed_operations: [read, write_spec_docs, run_schema_validation]
      prohibited_operations: [delete_history, bypass_policy]
      required_approvals: [protocol_owner]
      required_checks: [schema_lint, conformance_dry_run]
    acceptance_tests:
      - id: prot-v1-schema
        description: Object schemas validate canonical fixtures.
        verification_type: conformance
      - id: prot-v1-determinism
        description: Replay determinism test passes on golden fixtures.
        verification_type: conformance
    observability:
      metrics: [spec_coverage_protocol, conformance_pass_rate]
      events: [task_status_changed, acceptance_result_recorded]
    rollback_strategy:
      type: hybrid
      trigger_conditions: [conformance_failure, schema_breaking_change]
    dependencies: [SIVO-TASK-VERIFY_FOUNDATION]
    owner: core-protocol
    status: planned
    priority:
      level: critical
      score: 92
      rationale: Protocol determinism and schema correctness are foundational for all downstream services.
    progress: 0
    confidence: 0.0

  - task_id: SIVO-TASK-DUALMODE_RC
    title: Implement dual-mode reconcile and drift gates
    spec_section_ids: [SIVO-DUAL-003, SIVO-DUAL-004, SIVO-DUAL-007]
    objective: Build reconcile and drift detection semantics with release-blocking gate integration.
    intent_contract:
      problem_statement: Dual-mode drift can silently compromise trust and migration safety.
      desired_outcome: Drift is detected, classified, and blocked when severity requires.
      non_goals: [Silent auto-healing without audit trail]
      success_signals: [Blocking drift halts promotion, round-trip fixtures remain stable]
      constraints: [Must support cross-host compatibility matrix]
    bdd_scenarios:
      - id: bdd-dualmode-drift-block
        given: [Dual-write mode is enabled and drift is detected]
        when: [Drift severity is classified as blocking]
        then: [Promotion is denied and remediation diagnostics are emitted]
    adr_requirements:
      required: true
      adr_scope: [dualmode-reconcile, drift-classification]
      evidence_classes: [conformance, e2e, resilience]
    empirical_validation_plan:
      datasets_or_fixtures: [cross-host-roundtrip-fixtures-v1, drift-injection-fixtures-v1]
      success_thresholds: [blocking-drift-prevents-promotion, roundtrip-pass-rate-gte-0.99]
      confidence_reporting: true
    usability_criteria:
