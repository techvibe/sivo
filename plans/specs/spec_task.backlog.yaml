tasks:
  - task_id: SIVO-TASK-INTENT_BDD_FOUNDATION
    title: Enforce intent-driven and BDD execution framework
    spec_section_ids: [SIVO-INTENT-001, SIVO-INTENT-004, SIVO-AGENT-009]
    objective: Make intent contracts and BDD scenarios mandatory and enforced for all autonomous tasks.
    intent_contract:
      problem_statement: Autonomous work can drift from user intent without explicit behavior contracts.
      desired_outcome: Every task execution is bounded by intent and verified by BDD evidence.
      non_goals: [Allowing execution with missing intent or scenario coverage]
      success_signals: [All tasks validate against intent and BDD schema preflight]
      constraints: [Must remain compatible with verify-first gate policy and dashboard telemetry]
    bdd_scenarios:
      - id: bdd-intent-required-preflight
        given: [A task without intent contract or BDD scenarios]
        when: [Execution preflight runs]
        then: [Task is blocked with deterministic validation errors]
    adr_requirements:
      required: true
      adr_scope: [execution-governance, task-contract]
      evidence_classes: [conformance, e2e]
    empirical_validation_plan:
      datasets_or_fixtures: [task-schema-fixtures-v1, preflight-bypass-fixtures-v1]
      success_thresholds: [zero-preflight-bypass, schema-validation-pass-rate-equals-1]
      confidence_reporting: true
    usability_criteria:
      primary_personas: [agent_operator, developer]
      key_journeys: [submit-task-and-pass-preflight]
      max_critical_journey_fail_rate: 0.02
    scope:
      paths: [plans/specs/sivo_intent_bdd_execution_contract_v1.md, plans/specs/spec_task.schema.yaml]
      services: [orchestrator-service, validation-service, dashboard-service]
    policy_envelope:
      allowed_operations: [read, write_spec_docs, run_schema_validation]
      prohibited_operations: [bypass_policy]
      required_approvals: [architecture_owner, release_owner]
      required_checks: [intent_schema_check, bdd_schema_check, preflight_enforcement_test]
    acceptance_tests:
      - id: intent-bdd-schema-enforced
        description: Task schema requires intent and BDD fields for execution.
        verification_type: conformance
      - id: intent-bdd-dashboard-visibility
        description: Intent and BDD coverage metrics are published to dashboard.
        verification_type: integration
    observability:
      metrics: [intent_contract_coverage, bdd_coverage_ratio]
      events: [task_status_changed, conformance_result_recorded]
    rollback_strategy:
      type: hybrid
      trigger_conditions: [schema_regression, preflight_bypass_detected]
    dependencies: []
    owner: architecture-governance
    status: planned
    priority:
      level: critical
      score: 97
      rationale: Intent and behavior guardrails are the root safety layer for autonomous execution.
    progress: 0
    confidence: 0.0

  - task_id: SIVO-TASK-OUTLIER_SAFETY_FOUNDATION
    title: Implement exception and outlier safety controls
    spec_section_ids: [SIVO-SAFE-001, SIVO-SAFE-003, SIVO-SAFE-004, SIVO-AGENT-010]
    objective: Enforce fail-closed outlier handling, circuit breakers, uncertainty budgets, and fallback modes.
    intent_contract:
      problem_statement: Edge-case failures and adversarial prompts can force autonomous execution outside safe bounds.
      desired_outcome: Outlier scenarios are detected early and execution remains in strict guardrails.
      non_goals: [Allowing silent continuation after critical anomalies]
      success_signals: [Critical anomalies trigger breaker activation and safe fallback deterministically]
      constraints: [Must be auditable, tenant-configurable, and verification-gated]
    bdd_scenarios:
      - id: bdd-critical-anomaly-fail-closed
        given: [A critical anomaly signal is detected during mutation]
        when: [Safety controller evaluates the event]
        then: [Execution pauses, safe mode is enabled, and escalation is emitted]
    adr_requirements:
      required: true
      adr_scope: [safety-profile, breaker-strategy]
      evidence_classes: [conformance, resilience, usability]
    empirical_validation_plan:
      datasets_or_fixtures: [outlier-fault-fixtures-v1, prompt-injection-fixtures-v1]
      success_thresholds: [critical-anomaly-escape-rate-equals-zero, breaker-drill-pass-rate-equals-1]
      confidence_reporting: true
    usability_criteria:
      primary_personas: [security_owner, release_owner, agent_operator]
      key_journeys: [triage-guardrail-breach-and-reset-breaker]
      max_critical_journey_fail_rate: 0.02
    scope:
      paths: [plans/specs/sivo_exception_and_outlier_guardrails_v1.md, plans/specs/execution_safety_profile_v1.yaml]
      services: [safety-controller, orchestrator-service, dashboard-service]
    policy_envelope:
      allowed_operations: [read, write_spec_docs, run_fault_injection]
      prohibited_operations: [bypass_policy, auto-reset-breaker-without-approval]
      required_approvals: [security_owner, release_owner]
      required_checks: [outlier-safety-conformance, breaker-drill, uncertainty-gate-tests]
    acceptance_tests:
      - id: safety-fail-closed
        description: Critical anomalies force fail-closed behavior and stop mutation.
        verification_type: conformance
      - id: safety-fallback-mode-e2e
        description: Fallback mode transitions preserve lineage and allow safe recovery.
        verification_type: integration
    observability:
      metrics: [guardrail_breach_rate, circuit_breaker_activation_rate, uncertainty_breach_count]
      events: [guardrail_breach_detected, circuit_breaker_activated, fallback_mode_changed]
    rollback_strategy:
      type: hybrid
      trigger_conditions: [safety-policy-regression, breaker-reset-policy-violation]
    dependencies: [SIVO-TASK-INTENT_BDD_FOUNDATION]
    owner: safety-engineering
    status: planned
    priority:
      level: critical
      score: 98
      rationale: Outlier safety controls are required to prevent guardrail escape in autonomous runs.
    progress: 0
    confidence: 0.0

  - task_id: SIVO-TASK-ADV_HARDENING_FOUNDATION
    title: Implement red-team, differential safety, canary, and break-glass governance
    spec_section_ids: [SIVO-HARDEN-001, SIVO-HARDEN-003, SIVO-HARDEN-004, SIVO-HARDEN-005, SIVO-AGENT-011]
    objective: Enforce adversarial validation and safe rollout governance for safety-sensitive changes.
    intent_contract:
      problem_statement: Outlier-safe runtime still risks unsafe rollout without adversarial and rollout governance controls.
      desired_outcome: Safety-sensitive changes are blocked unless red-team, differential, and canary controls pass.
      non_goals: [Fast-tracking safety-sensitive releases without evidence]
      success_signals: [Red-team and differential gates pass; canary regressions trigger automatic rollback]
      constraints: [Must produce signed evidence and break-glass audit trails]
    bdd_scenarios:
      - id: bdd-adversarial-gate-block
        given: [A safety-sensitive release candidate with failed red-team cases]
        when: [Release gate evaluation runs]
        then: [Release is blocked and remediation tasks are created]
    adr_requirements:
      required: true
      adr_scope: [adversarial-governance, rollout-governance]
      evidence_classes: [conformance, resilience, benchmark]
    empirical_validation_plan:
      datasets_or_fixtures: [redteam-corpus-v1, differential-safety-fixtures-v1, canary-simulation-fixtures-v1]
      success_thresholds: [critical-redteam-failures-equals-zero, differential-mismatch-rate-lte-0.01]
      confidence_reporting: true
    usability_criteria:
      primary_personas: [security_owner, release_owner, tenant_admin]
      key_journeys: [approve-canary-or-trigger-rollback, audit-breakglass-use]
      max_critical_journey_fail_rate: 0.02
    scope:
      paths: [plans/specs/sivo_redteam_diff_canary_and_breakglass_v1.md, plans/specs/redteam_corpus_policy_v1.yaml, plans/specs/differential_safety_matrix_v1.yaml, plans/specs/canary_and_breakglass_policy_v1.yaml]
      services: [safety-controller, release-gate-service, dashboard-service]
    policy_envelope:
      allowed_operations: [read, write_spec_docs, run_adversarial_tests, run_canary_simulations]
      prohibited_operations: [bypass_release_gate, delete_breakglass_audit]
      required_approvals: [security_owner, release_owner]
      required_checks: [redteam_suite, differential_equivalence_suite, canary_governance_suite]
    acceptance_tests:
      - id: hardening-redteam-gate
        description: Red-team failures on critical cases block release.
        verification_type: conformance
      - id: hardening-canary-breakglass-governance
        description: Canary rollback and break-glass governance behave per policy and are auditable.
        verification_type: integration
    observability:
      metrics: [redteam_pass_rate, differential_mismatch_rate, canary_regression_rate, breakglass_invocation_count]
      events: [conformance_result_recorded, task_status_changed, benchmark_result_recorded]
    rollback_strategy:
      type: hybrid
      trigger_conditions: [adversarial-regression, canary-safety-regression]
    dependencies: [SIVO-TASK-OUTLIER_SAFETY_FOUNDATION]
    owner: safety-engineering
    status: planned
    priority:
      level: critical
      score: 96
      rationale: Advanced hardening prevents guardrail bypass during high-risk rollout conditions.
    progress: 0
    confidence: 0.0

  - task_id: SIVO-TASK-VERIFY_FOUNDATION
    title: Implement verification gate orchestration foundation
    spec_section_ids: [SIVO-VER-001, SIVO-VER-005, SIVO-AGENT-008]
    objective: Enforce verify-first staged execution guarantees across autonomous agent pipelines.
    intent_contract:
      problem_statement: Autonomous delivery can bypass critical checks without strict gate orchestration.
      desired_outcome: Every build path is blocked unless verify-first stage gates pass.
      non_goals: [Allowing manual bypasses without signed waivers]
      success_signals: [Stage order always enforced, releases blocked on critical check failure]
      constraints: [Must integrate with CI gate service, must emit auditable evidence]
    bdd_scenarios:
      - id: bdd-verify-stage-order
        given: [A pipeline with configured stage gates]
        when: [A later stage is attempted before prior critical stage passes]
        then: [Pipeline blocks execution and records a conformance failure]
    adr_requirements:
      required: true
      adr_scope: [release-orchestration, gate-policy]
      evidence_classes: [conformance, resilience]
    empirical_validation_plan:
      datasets_or_fixtures: [gate-order-fixtures-v1, waiver-policy-fixtures-v1]
      success_thresholds: [no-stage-skip, evidence-bundle-complete-rate-equals-1]
      confidence_reporting: true
    usability_criteria:
      primary_personas: [release_owner, security_owner]
      key_journeys: [diagnose-blocked-release]
      max_critical_journey_fail_rate: 0.02
    scope:
      paths: [plans/specs/sivo_verification_and_execution_guarantees_v1.md, plans/specs/verification_gate_policy_v1.yaml]
      services: [orchestrator-service, ci-gate-service]
    policy_envelope:
      allowed_operations: [read, write_spec_docs, run_gate_validation]
      prohibited_operations: [delete_history, bypass_policy]
      required_approvals: [release_owner, security_owner]
      required_checks: [gate_policy_lint, stage_order_conformance]
    acceptance_tests:
      - id: verify-stage-order
        description: Pipeline cannot skip required earlier stages.
        verification_type: conformance
      - id: verify-evidence-bundle
        description: Completion requires full signed evidence bundle.
        verification_type: conformance
    observability:
      metrics: [verification_gate_pass_rate, release_blocker_count]
      events: [task_status_changed, conformance_result_recorded]
    rollback_strategy:
      type: hybrid
      trigger_conditions: [gate_enforcement_failure, evidence_chain_break]
    dependencies: [SIVO-TASK-INTENT_BDD_FOUNDATION, SIVO-TASK-OUTLIER_SAFETY_FOUNDATION, SIVO-TASK-ADV_HARDENING_FOUNDATION]
    owner: release-engineering
    status: planned
    priority:
      level: critical
      score: 95
      rationale: Verify-first execution guarantees are prerequisite to safe autonomous build.
    progress: 0
    confidence: 0.0

  - task_id: SIVO-TASK-PROT_V1_BASE
    title: Publish protocol v1 schemas and invariants
    spec_section_ids: [SIVO-PROT-002, SIVO-PROT-003, SIVO-PROT-004, SIVO-PROT-005]
    objective: Implement protocol object schemas, operation contracts, and deterministic invariants.
    intent_contract:
      problem_statement: Protocol inconsistency breaks determinism and multi-agent correctness.
      desired_outcome: Protocol schemas and operations execute deterministically across providers.
      non_goals: [Provider-specific correctness semantics]
      success_signals: [Golden fixtures pass, replay determinism is stable]
      constraints: [Backward-compatible additive evolution only]
    bdd_scenarios:
      - id: bdd-protocol-determinism
        given: [A canonical event stream and fixed policy version]
        when: [Protocol replay is executed twice]
        then: [Terminal state and projection identifiers are identical]
    adr_requirements:
      required: true
      adr_scope: [protocol-objects, state-machine]
      evidence_classes: [conformance, benchmark]
    empirical_validation_plan:
      datasets_or_fixtures: [protocol-golden-fixtures-v1]
      success_thresholds: [determinism-mismatch-equals-zero]
      confidence_reporting: true
    usability_criteria:
