  - task_id: SIVO-TASK-PERF_GATES
    title: Enforce benchmark and scale release gates
    spec_section_ids: [SIVO-PERF-001, SIVO-PERF-003, SIVO-PERF-005]
    objective: Operationalize benchmark suite and release blocks for 3-10x performance targets.
    intent_contract:
