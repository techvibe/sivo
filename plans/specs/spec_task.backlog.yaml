    intent_contract:
      problem_statement: Learning systems can unintentionally weaken deterministic guardrails.
      desired_outcome: Learning improves efficiency while policy decisions remain deterministic and enforceable.
      non_goals: [Direct model-driven policy bypass]
      success_signals: [Recommendation quality improves, no guardrail boundary violations]
      constraints: [Tenant isolation, signed config changes, shadow-mode before rollout]
    bdd_scenarios:
      - id: bdd-learning-boundary
        given: [A learning recommendation proposes workflow optimization]
        when: [Policy evaluation is executed for activation]
        then: [Recommendation is applied only if policy allows and is fully auditable]
    adr_requirements:
      required: true
      adr_scope: [learning-boundary, recommendation-rollout]
      evidence_classes: [policy, benchmark, usability]
    empirical_validation_plan:
