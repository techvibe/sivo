      key_journeys: [triage-drift-and-remediate]
      max_critical_journey_fail_rate: 0.03
    scope:
      paths: [plans/specs/sivo_git_dualmode_contract_v1.md]
      services: [projection-service, drift-service, dashboard-service]
    policy_envelope:
      allowed_operations: [read, write_spec_docs, run_conformance_tests]
      prohibited_operations: [force_release]
      required_approvals: [interop_owner, release_owner]
      required_checks: [cross_host_matrix, roundtrip_suite]
    acceptance_tests:
      - id: dualmode-drift-block
        description: Blocking drift stops promotion operations.
        verification_type: conformance
      - id: dualmode-roundtrip
        description: Strict and graceful profiles pass fixture matrix.
        verification_type: integration
    observability:
      metrics: [dualmode_drift_rate, compatibility_pass_rate]
      events: [task_status_changed, conformance_result_recorded]
    rollback_strategy:
      type: automatic
      trigger_conditions: [projection_nondeterminism, cross_host_failure]
    dependencies: [SIVO-TASK-PROT_V1_BASE]
    owner: interop-core
    status: planned
    priority:
