version: "1.0.0"
policy_mode: hybrid_required_for_release
signature_profiles:
  release_default:
    required_components:
      - classical_ed25519
      - pq_mldsa_65
    allow_local_draft_reduced_profile: true
  strict_enterprise:
    required_components:
      - classical_ed25519
      - pq_mldsa_87
transport_profiles:
  default_hybrid:
    key_establishment_components:
      - classical_x25519
      - pq_mlkem_768
  strict_enterprise_hybrid:
    key_establishment_components:
      - classical_x25519
      - pq_mlkem_1024
artifact_requirements:
  - suite_id
  - key_id
  - signature_components
  - verification_result
rotation:
  max_rotation_days: 180
  require_rotation_drill: true
downgrade_policy:
  detect_and_log: true
  block_release_on_downgrade: true
compliance:
  protected_environments_require_hybrid: true
